[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "splitkaro"
version = "1.0.0"
description = "Group expense splitter & settlement CLI (BITS SEZG534 Assignment 1, Part 1A)"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "hypothesis>=6", "ruff>=0.6", "bandit>=1.7"]

[project.scripts]
splitkaro = "splitkaro.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
